<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collector's Vault</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="panel">

      <div class="brand">
        <h1>Collector's Vault</h1>
        <p>Art Trading Card Registry</p>
      </div>

      <div class="content">

        <p class="eyebrow">WELCOME TO THE VAULT</p>

        <h2>Register Your Card</h2>

        <p class="description">
          Enter the ID printed on your art trading card to add it to your collection.
        </p>

        <form id="card-form">

          <label for="card-id">Card ID</label>

          <input
            type="text"
            id="card-id"
            placeholder="SW-XXXXXXXX"
            autocomplete="off"
            required
          >

          <button type="submit" id="register-button">
            Register Card
          </button>

        </form>

        <div id="message"></div>

        <div class="page-links">
          <a href="vault.html" class="text-link">View My Vault</a>
        </div>

      </div>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("card-form");
    const input = document.getElementById("card-id");
    const message = document.getElementById("message");
    const registerButton = document.getElementById("register-button");

    const params = new URLSearchParams(window.location.search);
    const cardFromQR = params.get("card");

    if (cardFromQR) {
      input.value = cardFromQR.toUpperCase();
    }

    async function getOrCreateUser() {
      const {
        data: { user }
      } = await supabaseClient.auth.getUser();

      if (user) {
        return user;
      }

      const { data, error } =
        await supabaseClient.auth.signInAnonymously();

      if (error) {
        throw error;
      }

      return data.user;
    }

    async function registerCard(card) {
      message.textContent = "Registering card...";

      const { error } = await supabaseClient.rpc(
        "register_card",
        {
          p_card_id: card.id
        }
      );

      if (error) {
        console.error(error);

        message.innerHTML = `
          <div class="status-box">
            <small>Registration issue</small>
            <strong>${error.message}</strong>
          </div>
        `;

        registerButton.disabled = false;
        return;
      }

      message.innerHTML = `
        <div class="status-box success-box">
          <small>Card registered</small>
          <strong>${card.name}</strong>
          <span>${card.id}</span>

          <a href="vault.html" class="primary-link">
            View My Vault
          </a>
        </div>

        <div class="status-box notice-box">
          <small>Protect your collection</small>
          <strong>Your Vault is currently saved on this device.</strong>
          <span>
            You can secure it with an email later so you can recover it on another device.
          </span>
        </div>
      `;

      form.reset();
      registerButton.disabled = false;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const cardId = input.value.trim().toUpperCase();

      registerButton.disabled = true;
      message.textContent = "Checking card...";

      const { data: card, error: cardError } =
        await supabaseClient
          .from("cards")
          .select("id, name")
          .eq("id", cardId)
          .maybeSingle();

      if (cardError) {
        console.error(cardError);
        message.textContent =
          "Something went wrong. Please try again.";
        registerButton.disabled = false;
        return;
      }

      if (!card) {
        message.textContent =
          "We couldn't find a card with that ID.";
        registerButton.disabled = false;
        return;
      }

      try {
        await getOrCreateUser();
      } catch (error) {
        console.error(error);
        message.textContent =
          "We couldn't create your Vault. Please try again.";
        registerButton.disabled = false;
        return;
      }

      const {
        data: { user }
      } = await supabaseClient.auth.getUser();

      const { data: existing, error: existingError } =
        await supabaseClient
          .from("ownerships")
          .select("id")
          .eq("owner_id", user.id)
          .eq("card_id", card.id)
          .eq("active", true);

      if (existingError) {
        console.error(existingError);
        message.textContent =
          "Something went wrong. Please try again.";
        registerButton.disabled = false;
        return;
      }

      if (existing && existing.length > 0) {
        message.innerHTML = `
          <div class="status-box">
            <small>You already own this card</small>
            <strong>${card.name}</strong>
            <span>
              You currently have ${existing.length}
              registered ${existing.length === 1 ? "copy" : "copies"}.
            </span>

            <button
              type="button"
              id="register-another"
              class="secondary-button"
            >
              Register Another Physical Copy
            </button>
          </div>
        `;

        document
          .getElementById("register-another")
          .addEventListener("click", function() {
            registerCard(card);
          });

        registerButton.disabled = false;
        return;
      }

      registerCard(card);
    });
  </script>

</body>
</html>
