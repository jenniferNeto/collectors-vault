<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure My Vault | Collector's Vault</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="panel">

      <div class="brand">
        <h1>Collector's Vault</h1>
        <p>Secure Your Collection</p>
      </div>

      <div class="content">

        <p class="eyebrow">YOUR VAULT</p>

        <h2>Secure My Vault</h2>

        <p class="description">
          Add your email so you can recover your collection on another device.
        </p>

        <div id="user-status"></div>

        <form id="login-form">

          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

          <button type="submit" id="login-button">
            Send Secure Link
          </button>

        </form>

        <div id="message"></div>

        <div class="page-links">
          <a href="vault.html" class="text-link">
            ← Back to My Vault
          </a>
        </div>

      </div>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("login-form");
    const message = document.getElementById("message");
    const userStatus = document.getElementById("user-status");
    const loginButton = document.getElementById("login-button");
    const emailInput = document.getElementById("email");

    async function initializePage() {
      const {
        data: { user }
      } = await supabaseClient.auth.getUser();

      if (!user) {
        userStatus.innerHTML = `
          <div class="status-box">
            <small>No Vault found</small>
            <strong>Register a card first to create your Vault.</strong>
          </div>
        `;

        form.style.display = "none";
        return;
      }

      if (!user.is_anonymous) {
        userStatus.innerHTML = `
          <div class="status-box success-box">
            <small>Vault already secured</small>
            <strong>${user.email}</strong>
          </div>
        `;

        form.style.display = "none";
        return;
      }

      userStatus.innerHTML = `
        <div class="status-box notice-box">
          <small>Temporary Vault</small>
          <strong>Your collection is currently saved on this device.</strong>
          <span>
            Add your email to secure this Vault.
          </span>
        </div>
      `;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = emailInput.value.trim();

      loginButton.disabled = true;
      loginButton.textContent = "Checking Email...";

      message.innerHTML = "";

      const {
        data: { user }
      } = await supabaseClient.auth.getUser();

      if (!user || !user.is_anonymous) {
        message.innerHTML = `
          <div class="status-box">
            <small>Unable to continue</small>
            <strong>This Vault is not a temporary Vault.</strong>
          </div>
        `;

        loginButton.disabled = false;
        loginButton.textContent = "Send Secure Link";
        return;
      }

      const { error } = await supabaseClient.auth.updateUser({
        email: email
      });

      if (error) {
        console.error(error);

        const msg = (error.message || "").toLowerCase();

        if (
          msg.includes("already been registered") ||
          msg.includes("already registered") ||
          msg.includes("already exists")
        ) {
          message.innerHTML = `
            <div class="status-box notice-box">
              <small>Existing Vault found</small>
              <strong>
                This email is already connected to a Collector's Vault.
              </strong>
              <span>
                Sign in to your existing Vault instead.
              </span>

              <button
                type="button"
                id="signin-existing"
                class="secondary-button"
              >
                Sign In Instead
              </button>
            </div>
          `;

          document
            .getElementById("signin-existing")
            .addEventListener("click", async function() {

              this.disabled = true;
              this.textContent = "Sending Sign-In Link...";

              const { error: signInError } =
                await supabaseClient.auth.signInWithOtp({
                  email: email,
                  options: {
                    emailRedirectTo:
                      "https://collectors-vault.jennlarps.workers.dev/vault.html"
                  }
                });

              if (signInError) {
                console.error(signInError);

                message.innerHTML = `
                  <div class="status-box">
                    <small>Unable to sign in</small>
                    <strong>${signInError.message}</strong>
                  </div>
                `;

                return;
              }

              message.innerHTML = `
                <div class="status-box success-box">
                  <small>Check your email</small>
                  <strong>Sign-in link sent.</strong>
                  <span>
                    Open the link to access your existing Vault.
                  </span>
                </div>
              `;
            });

          loginButton.disabled = false;
          loginButton.textContent = "Send Secure Link";

          return;
        }

        message.innerHTML = `
          <div class="status-box">
            <small>Unable to send link</small>
            <strong>${error.message}</strong>
          </div>
        `;

        loginButton.disabled = false;
        loginButton.textContent = "Send Secure Link";
        return;
      }

      message.innerHTML = `
        <div class="status-box success-box">
          <small>Check your email</small>
          <strong>We sent a confirmation link to ${email}.</strong>
          <span>
            Open that link to secure this Vault to your email.
          </span>
        </div>
      `;

      form.style.display = "none";
    });

    initializePage();
  </script>

</body>
</html>
