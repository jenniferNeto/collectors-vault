<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Collector's Vault</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="register-card">

      <div class="brand">
        <h1>Collector's Vault</h1>
        <p>Art Trading Card Registry</p>
      </div>

      <div class="content">

        <p class="eyebrow">YOUR VAULT</p>

        <h2>Sign In</h2>

        <p class="description">
          Enter your email and we'll send you a secure sign-in link.
          No password needed.
        </p>

        <form id="login-form">

          <label for="email">Email</label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

          <button type="submit">
            Send Sign-In Link
          </button>

        </form>

        <div id="message"></div>

        <div class="signin">
          <a href="/">← Register a card</a>
        </div>

      </div>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("login-form");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document
        .getElementById("email")
        .value
        .trim();

      message.textContent = "Sending sign-in link...";

      const { error } = await supabaseClient.auth.signInWithOtp({
        email: email,
        options: {
          emailRedirectTo:
            "https://collectors-vault.jennlarps.workers.dev/vault.html"
        }
      });

      if (error) {
        console.error(error);
        message.textContent =
          "We couldn't send the sign-in link. Please try again.";
        return;
      }

      message.innerHTML = `
        <div class="card-found">
          <small>Check your email</small>
          <strong>Sign-in link sent</strong>
          <span>
            Open the link we sent to ${email}.
          </span>
        </div>
      `;
    });
  </script>

</body>
</html>
