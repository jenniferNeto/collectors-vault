<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure My Vault | Collector's Vault</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="panel">

      <div class="brand">
        <h1>Collector's Vault</h1>
        <p>Secure Your Collection</p>
      </div>

      <div class="content">

        <p class="eyebrow">YOUR VAULT</p>

        <h2>Secure My Vault</h2>

        <p class="description">
          Add your email so you can recover your collection on another device.
        </p>

        <div id="user-status"></div>

        <form id="login-form">

          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

          <button type="submit" id="login-button">
            Send Secure Link
          </button>

        </form>

        <div id="message"></div>

        <div class="page-links">
          <a href="vault.html" class="text-link">
            ← Back to My Vault
          </a>
        </div>

      </div>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("login-form");
    const message = document.getElementById("message");
    const userStatus = document.getElementById("user-status");
    const loginButton = document.getElementById("login-button");

    async function initializePage() {
      const {
        data: { user }
      } = await supabaseClient.auth.getUser();

      if (!user) {
        userStatus.innerHTML = `
          <div class="status-box">
            <small>No Vault found</small>
            <strong>Register a card first to create your Vault.</strong>
          </div>
        `;

        form.style.display = "none";
        return;
      }

      if (!user.is_anonymous) {
        userStatus.innerHTML = `
          <div class="status-box success-box">
            <small>Vault already secured</small>
            <strong>${user.email}</strong>
          </div>
        `;

        form.style.display = "none";
        return;
      }

      userStatus.innerHTML = `
        <div class="status-box notice-box">
          <small>Temporary Vault</small>
          <strong>Your collection is currently saved on this device.</strong>
          <span>
            Adding an email lets you recover this same Vault later.
          </span>
        </div>
      `;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document
        .getElementById("email")
        .value
        .trim();

      loginButton.disabled = true;
      loginButton.textContent = "Sending Link...";

      message.innerHTML = "";

      const {
        data: { user }
      } = await supabaseClient.auth.getUser();

      if (!user || !user.is_anonymous) {
        message.innerHTML = `
          <div class="status-box">
            <small>Unable to continue</small>
            <strong>This Vault is not an anonymous Vault.</strong>
          </div>
        `;

        loginButton.disabled = false;
        loginButton.textContent = "Send Secure Link";
        return;
      }

      const { error } = await supabaseClient.auth.updateUser({
        email: email
      });

      if (error) {
        console.error(error);

        message.innerHTML = `
          <div class="status-box">
            <small>Unable to send link</small>
            <strong>${error.message}</strong>
          </div>
        `;

        loginButton.disabled = false;
        loginButton.textContent = "Send Secure Link";
        return;
      }

      message.innerHTML = `
        <div class="status-box success-box">
          <small>Check your email</small>
          <strong>We sent a confirmation link to ${email}.</strong>
          <span>
            Open that link to secure this Vault to your email.
          </span>
        </div>
      `;

      form.style.display = "none";
    });

    initializePage();
  </script>

</body>
</html>
