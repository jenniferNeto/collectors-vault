<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure My Vault | Collector's Vault</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="panel">

      <div class="brand">
        <h1>Collector's Vault</h1>
        <p>Secure Your Collection</p>
      </div>

      <div class="content">

        <p class="eyebrow">YOUR VAULT</p>

        <h2>Secure My Vault</h2>

        <p class="description">
          Add your email so you can recover your collection on another device.
        </p>

        <div id="user-status"></div>

        <form id="login-form">

          <label for="email">Email</label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

          <button type="submit" id="login-button">
            Secure My Vault
          </button>

        </form>

        <div id="message"></div>

        <div class="page-links">
          <a href="vault.html" class="text-link">
            ← Back to My Vault
          </a>
        </div>

      </div>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("login-form");
    const message = document.getElementById("message");
    const userStatus = document.getElementById("user-status");
    const loginButton = document.getElementById("login-button");
    const emailInput = document.getElementById("email");

    async function initializePage() {

      const {
        data: { user }
      } = await supabaseClient.auth.getUser();

      if (!user) {

        userStatus.innerHTML = `
          <div class="status-box">
            <small>No Vault found</small>
            <strong>Register a card first to create your Vault.</strong>
          </div>
        `;

        form.style.display = "none";
        return;
      }

      if (!user.is_anonymous) {

        userStatus.innerHTML = `
          <div class="status-box success-box">
            <small>Vault already secured</small>
            <strong>${user.email}</strong>
          </div>
        `;

        form.style.display = "none";
        return;
      }

      userStatus.innerHTML = `
        <div class="status-box notice-box">
          <small>Temporary Vault</small>
          <strong>Your collection is currently saved on this device.</strong>
          <span>
            Add an email to protect your collection and access it later.
          </span>
        </div>
      `;
    }


    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email = emailInput.value.trim();

      loginButton.disabled = true;
      loginButton.textContent = "Checking Email...";

      message.innerHTML = "";

      const {
        data: { user }
      } = await supabaseClient.auth.getUser();

      if (!user || !user.is_anonymous) {

        message.innerHTML = `
          <div class="status-box">
            <small>Unable to continue</small>
            <strong>This is not a temporary Vault.</strong>
          </div>
        `;

        resetButton();
        return;
      }


      /*
       * First try attaching this email directly
       * to the temporary Vault.
       */

      const { error } =
        await supabaseClient.auth.updateUser({
          email: email
        });


      if (!error) {

        message.innerHTML = `
          <div class="status-box success-box">
            <small>Check your email</small>

            <strong>
              We sent a confirmation link to ${email}.
            </strong>

            <span>
              Open the link to secure this Vault to your email.
            </span>
          </div>
        `;

        form.style.display = "none";
        return;
      }


      console.error(error);

      const errorText =
        (error.message || "").toLowerCase();


      /*
       * Email already belongs to another Vault.
       */

      if (
        errorText.includes("already been registered") ||
        errorText.includes("already registered") ||
        errorText.includes("already exists")
      ) {

        message.innerHTML = `
          <div class="status-box notice-box">

            <small>Existing Vault found</small>

            <strong>
              This email already has a Collector's Vault.
            </strong>

            <span>
              Sign in to your existing Vault and we'll add the
              cards from this temporary Vault to it.
            </span>

            <button
              type="button"
              id="signin-existing"
              class="secondary-button"
            >
              Sign In Instead
            </button>

          </div>
        `;


        document
          .getElementById("signin-existing")
          .addEventListener("click", async function() {

            const button = this;

            button.disabled = true;
            button.textContent =
              "Preparing Your Vault...";


            /*
             * Create a temporary one-time merge token.
             */

            const {
              data: mergeToken,
              error: tokenError
            } =
              await supabaseClient.rpc(
                "create_vault_merge_token"
              );


            if (tokenError) {

              console.error(tokenError);

              message.innerHTML = `
                <div class="status-box">
                  <small>Unable to continue</small>
                  <strong>${tokenError.message}</strong>
                </div>
              `;

              return;
            }


            const returnUrl =
              "https://collectors-vault.jennlarps.workers.dev/vault.html"
              + "?merge_token="
              + encodeURIComponent(mergeToken);


            /*
             * Send the existing account its sign-in link.
             */

            const { error: signInError } =
              await supabaseClient.auth.signInWithOtp({
                email: email,

                options: {
                  emailRedirectTo: returnUrl
                }
              });


            if (signInError) {

              console.error(signInError);

              message.innerHTML = `
                <div class="status-box">
                  <small>Unable to sign in</small>
                  <strong>${signInError.message}</strong>
                </div>
              `;

              return;
            }


            message.innerHTML = `
              <div class="status-box success-box">

                <small>Check your email</small>

                <strong>
                  Sign-in link sent to ${email}.
                </strong>

                <span>
                  Open the link and your temporary cards will
                  automatically be added to your existing Vault.
                </span>

              </div>
            `;

            form.style.display = "none";
          });


        resetButton();
        return;
      }


      message.innerHTML = `
        <div class="status-box">
          <small>Unable to secure Vault</small>
          <strong>${error.message}</strong>
        </div>
      `;

      resetButton();
    });


    function resetButton() {
      loginButton.disabled = false;
      loginButton.textContent = "Secure My Vault";
    }


    initializePage();
  </script>

</body>
</html>
